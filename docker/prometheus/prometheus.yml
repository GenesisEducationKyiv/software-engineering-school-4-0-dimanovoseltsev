global:
  evaluation_interval: 1s
  scrape_interval: 1s

scrape_configs:
  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]

  - job_name: 'apis'
    static_configs:
      - targets: [ 'nginx-currencies:80', "nginx-customers:80", "nginx-subscriptions:80" ]
        labels:
          __metrics_path__: /metrics

