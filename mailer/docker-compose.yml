version: '3.7'

services:
  fpm:
    build: .
    working_dir: /app
    restart: always
    volumes:
      - .:/app
    networks:
      - currency-rate-app-network
    environment:
      - TZ=America/New_York

  app-setup:
    build: .
    networks:
      - currency-rate-app-network
    user: root
    working_dir: /app
    tty: true
    stdin_open: true
    command: /bin/bash -c "composer install ;sleep 10; php yii app/init --interactive=0"
    volumes:
      - .:/app
    environment:
      - TZ=America/New_York

  nginx:
    container_name: nginx-mailer
    image: nginx:latest
    restart: always
    ports:
      - "9852:80"
      - "9853:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/app
    networks:
      - currency-rate-app-network

