  elasticsearch:
    container_name: temporal-elasticsearch
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    image: elasticsearch:7.16.2
    restart: always
    networks:
      - currency-rate-app-network
    expose:
      - 9200
    volumes:
      - /var/lib/elasticsearch/data

  temporal:
    container_name: temporal
    depends_on:
      - mysql
      - elasticsearch
    environment:
      - DB=mysql8
      - DB_PORT=3306
      - DBNAME=temporal
      - VISIBILITY_DBNAME=temporal_visibility
      - MYSQL_SEEDS=mysql
      - MYSQL_USER=db_user
      - MYSQL_PWD=db_pass
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
      - ENABLE_ES=true
      - ES_SEEDS=elasticsearch
      - ES_VERSION=v7
      - frontend.enableUpdateWorkflowExecution=true
      - frontend.enableUpdateWorkflowExecutionAsyncAccepted=true
    image: temporalio/auto-setup:1.24.2
    restart: always
    networks:
      - currency-rate-app-network
    ports:
      - 7233:7233
    labels:
      kompose.volume.type: configMap
    volumes:
      - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:1.21.0
    restart: always
    networks:
      - currency-rate-app-network
    stdin_open: true
    tty: true

  temporal-ui:
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.16.1
    restart: always
    networks:
      - currency-rate-app-network
    ports:
      - 8080:8080

  collector:
    container_name: collector
    image: otel/opentelemetry-collector-contrib:0.79.0
    networks:
      - currency-rate-app-network
    command: [ "--config=/etc/otel-collector-config.yml" ]
    restart: always
    ports:
      - 4317:4317
      - 4318:4318
    volumes:
      - ./docker/otel/otel-collector-config.yml:/etc/otel-collector-config.yml

  zipkin:
    container_name: zipkin
    restart: always
    image: openzipkin/zipkin-slim
    networks:
      - currency-rate-app-network
    ports:
      - 9411:9411


networks:
  currency-rate-app-network:
    name: "currency-rate-app-network"
    driver: bridge

volumes:
  mysql_currency_rates_api:
  rabbitmq_currency_rates_api:
  grafana_currency_rates_api:
