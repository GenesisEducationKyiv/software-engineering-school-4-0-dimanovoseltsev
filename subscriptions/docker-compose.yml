  nginx:
    container_name: nginx-subscriptions
    image: nginx:latest
    restart: always
    ports:
      - "9832:80"
      - "9833:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/app
    networks:
      - currency-rate-app-network

