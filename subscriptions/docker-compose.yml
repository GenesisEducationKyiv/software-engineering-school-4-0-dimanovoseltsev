  app-temporal:
    build:
      dockerfile: DockerfileTemporal
      context: ./
    # volumes:
    #  - ./app:/var/app
#    depends_on:
#      - temporal
    networks:
      - currency-rate-app-network
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - TELEMETRY_DRIVER=otel
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4318
      - OTEL_PHP_TRACES_PROCESSOR=simple
      - TEMPORAL_HOST=temporal
      - OTEL_HOST=collector
      - INTERCEPTORS_RR_PATH=/usr/local/bin/rr
    command: [ "/usr/local/bin/wait-for-temporal.sh", "temporal", "/usr/local/bin/rr", "serve", "-c", "/app/.rr.yaml" ]

